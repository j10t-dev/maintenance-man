[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maintenance-man"
version = "0.1.0"
description = "Config-driven CLI for routine software project maintenance"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cyclopts==4.25.2",
    "packaging==26.3",
    "pydantic==2.13.5",
    "rich==15.0.0",
]

[project.scripts]
mm = "maintenance_man.cli:main"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pytest==9.1.1",
    "ruff==0.15.20",
    "ty>=0.0.34",
]

[tool.ruff]
line-length = 88
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "SIM", "C4", "UP", "RUF", "PERF", "RET", "PIE", "PTH", "FURB", "RSE", "ERA", "PLE", "N"]

[tool.ty.src]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests with real external web-dependencies",
    "component: tests that require Docker or full service stack",
]
addopts = "-m 'not integration and not component'"
