import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import groovy.xml.XmlParser
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import org.gradle.api.GradleException
import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedArtifactResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

def pluginRepositories = []
def pluginRepositoryObjects = []
def settingsRepositories = []
def repositoryRows = { repositories, projectPath, domain ->
    repositories.collect { repository ->
        def safe = null
        if (repository instanceof MavenArtifactRepository) {
            def uri = repository.url
            if (uri.userInfo == null && uri.query == null && uri.fragment == null) {
                safe = uri.toString()
            }
        }
        [project_path: projectPath, domain: domain, url: safe]
    }
}
def atomicJson = { File directory, String name, Object value ->
    if (Files.isSymbolicLink(directory.toPath()) ||
        Files.isSymbolicLink(new File(directory, '.mm-owned').toPath()) ||
        !new File(directory, '.mm-owned').isFile()) {
        throw new GradleException('mm output ownership was lost')
    }
    def destination = new File(directory, name)
    if (Files.isSymbolicLink(destination.toPath())) {
        throw new GradleException('mm output is a symlink')
    }
    def temporary = Files.createTempFile(directory.toPath(), '.mm-report-', '.json')
    try {
        Files.writeString(temporary, JsonOutput.toJson(value))
        Files.move(temporary, destination.toPath(),
                   StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
    } finally {
        Files.deleteIfExists(temporary)
    }
}
gradle.settingsEvaluated { settings ->
    pluginRepositories = repositoryRows(settings.pluginManagement.repositories, ':', 'plugin')
    pluginRepositoryObjects = settings.pluginManagement.repositories.toList()
    settingsRepositories = repositoryRows(settings.dependencyResolutionManagement.repositories, ':', 'library')
}
gradle.projectsEvaluated {
    def root = gradle.rootProject
    ['mmGradleReport', 'mmGradleValidateCandidates'].each { name ->
        if (root.tasks.findByName(name) != null) {
            throw new GradleException("Reserved task name already exists: ${name}")
        }
    }
    def directory = new File(root.projectDir, '.mm-gradle-inventory')
    def readCandidateRequests = {
        def inputFile = new File(directory, 'candidate-requests.json')
        if (Files.isSymbolicLink(inputFile.toPath())) {
            throw new GradleException('Candidate request is a symlink')
        }
        def input = new JsonSlurper().parse(inputFile)
        if (input.schema_version != 1 || !(input.requests instanceof List)) {
            throw new GradleException('Unsupported candidate request schema')
        }
        input.requests
    }
    def validateProjectRequests = { project ->
        def exact = { String value -> value ==~ /[A-Za-z0-9][A-Za-z0-9._+-]*/ }
        def results = []
        readCandidateRequests().findAll { it.project_path == project.path }.each { request ->
            def row = [request_id: request.request_id, group_key: request.group_key,
                       alias: request.alias, project_path: request.project_path, kind: request.kind,
                       selected_version: null, implementation: null, reason: null]
            try {
                if (!(request.kind in ['library', 'plugin']) ||
                    !exact(request.installed_version) || !exact(request.candidate_version) ||
                    request.installed_version == request.candidate_version) {
                    throw new GradleException('Candidate is not an exact changed version')
                }
                def handler = project.dependencies
                def configurations = project.configurations
                def coordinate = request.coordinate
                if (request.kind == 'plugin') {
                    if (project != root) {
                        throw new GradleException('Plugin candidates require the root project')
                    }
                    handler = root.buildscript.dependencies
                    configurations = root.buildscript.configurations
                    pluginRepositoryObjects.each { repository ->
                        if (!root.buildscript.repositories.contains(repository)) {
                            root.buildscript.repositories.add(repository)
                        }
                    }
                    coordinate = "${request.coordinate}:${request.coordinate}.gradle.plugin"
                }
                def resolveOne = { String notation ->
                    def dependency = handler.create(notation)
                    def detached = configurations.detachedConfiguration(dependency)
                    detached.transitive = false
                    def dependencies = detached.incoming.resolutionResult.rootComponent.get().dependencies
                    if (dependencies.size() != 1 || !(dependencies.first() instanceof ResolvedDependencyResult)) {
                        throw new GradleException('Exact metadata request unresolved')
                    }
                    def selected = dependencies.first().selected.id
                    if (!(selected instanceof ModuleComponentIdentifier)) {
                        throw new GradleException('Metadata request selected a project substitution')
                    }
                    def parts = coordinate.split(':')
                    if (notation.startsWith(coordinate + ':') &&
                        (selected.group != parts[0] || selected.module != parts[1])) {
                        throw new GradleException('Metadata request changed module identity')
                    }
                    selected
                }
                def selected = resolveOne("${coordinate}:[${request.installed_version},${request.candidate_version}]")
                if (selected.version != request.candidate_version) {
                    throw new GradleException('Native interval did not select the exact candidate')
                }
                if (request.kind == 'plugin') {
                    def query = handler.createArtifactResolutionQuery()
                        .forModule(selected.group, selected.module, selected.version)
                        .withArtifacts(MavenModule, MavenPomArtifact).execute()
                    def components = query.resolvedComponents
                    if (components.size() != 1) {
                        throw new GradleException('Standard plugin marker POM unavailable')
                    }
                    def artifacts = components.first().getArtifacts(MavenPomArtifact)
                    if (artifacts.size() != 1 || !(artifacts.first() instanceof ResolvedArtifactResult)) {
                        throw new GradleException('Standard plugin marker POM unresolved')
                    }
                    def parser = new XmlParser(false, false)
                    parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
                    parser.setFeature('http://xml.org/sax/features/external-general-entities', false)
                    parser.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
                    def pom = parser.parse(artifacts.first().file)
                    if (pom.groupId.text() != selected.group || pom.artifactId.text() != selected.module ||
                        pom.version.text() != selected.version) {
                        throw new GradleException('Marker POM identity is not exact')
                    }
                    def dependencies = pom.dependencies.dependency
                    if (dependencies.size() != 1) {
                        throw new GradleException('Marker must have one exact implementation dependency')
                    }
                    def implementation = dependencies.first()
                    def group = implementation.groupId.text()
                    def artifact = implementation.artifactId.text()
                    def version = implementation.version.text()
                    if (!exact(group) || !exact(artifact) || !exact(version) ||
                        !(implementation.scope.text() in ['', 'compile', 'runtime']) ||
                        !(implementation.type.text() in ['', 'jar']) || implementation.classifier.text()) {
                        throw new GradleException('Unsupported marker implementation declaration')
                    }
                    def resolved = resolveOne("${group}:${artifact}:${version}")
                    if (resolved.group != group || resolved.module != artifact || resolved.version != version) {
                        throw new GradleException('Marker implementation did not resolve exactly')
                    }
                    row.implementation = [group: group, artifact: artifact, version: version]
                }
                row.selected_version = selected.version
            } catch (Exception failure) {
                // Never serialize resolver exception messages: private repository
                // credentials can occur in their rendered URLs.
                row.reason = "Native metadata validation failed (${failure.class.simpleName})"
                row.selected_version = null
                row.implementation = null
            }
            results.add(row)
        }
        results
    }
    // A task may resolve only its own project's configurations when parallel
    // execution is enabled. Dependencies give the aggregator a complete batch.
    def projectResults = new java.util.concurrent.ConcurrentHashMap()
    def validators = root.allprojects.sort { it.path }.collect { project ->
        def name = 'mmGradleValidateProjectCandidates'
        if (project.tasks.findByName(name) != null) {
            throw new GradleException("Reserved task name already exists: ${project.path}:${name}")
        }
        project.tasks.register(name) {
            doLast {
                projectResults.put(project.path, validateProjectRequests(project))
            }
        }
    }
    root.tasks.register('mmGradleValidateCandidates') {
        dependsOn(validators)
        doLast {
            def results = projectResults.values().collectMany { it }
            readCandidateRequests().findAll { !projectResults.containsKey(it.project_path) }.each { request ->
                results.add([request_id: request.request_id, group_key: request.group_key,
                             alias: request.alias, project_path: request.project_path, kind: request.kind,
                             selected_version: null, implementation: null,
                             reason: 'Native metadata validation failed (unknown project)'])
            }
            atomicJson(directory, 'candidate-validation.json',
                [schema_version: 1, results: results.sort { it.request_id }])
        }
    }
    root.tasks.register('mmGradleReport') {
        dependsOn(root.tasks.named('cyclonedxBom'))
        doLast {
            def scopes = []
            def selected = []
            def errors = []
            def repositories = [] + pluginRepositories + settingsRepositories
            def cdxVersions = [] as Set
            root.allprojects.sort { it.path }.each { project ->
                repositories.addAll(repositoryRows(project.repositories, project.path, 'library'))
                def direct = project.tasks.findByName('cyclonedxDirectBom')
                if (direct == null || !direct.enabled) {
                    return
                }
                def original = direct.class
                while (original.superclass != null &&
                       original.name != 'org.cyclonedx.gradle.CyclonedxDirectTask') {
                    original = original.superclass
                }
                def cdxVersion = original.package?.implementationVersion
                if (cdxVersion == null) {
                    def location = original.protectionDomain?.codeSource?.location?.toString() ?: ''
                    def match = (location =~ /cyclonedx-gradle-plugin-([0-9][^\/]*?)\.jar$/)
                    if (match.find()) { cdxVersion = match.group(1) }
                }
                if (cdxVersion == null) {
                    errors.add("Cannot establish CycloneDX version for ${project.path}")
                } else {
                    cdxVersions.add(cdxVersion)
                }
                def includes
                def skips
                def buildEnvironment
                try {
                    includes = direct.includeConfigs.get()
                    skips = direct.skipConfigs.get()
                    buildEnvironment = direct.includeBuildEnvironment.get()
                    includes.each { java.util.regex.Pattern.compile(it) }
                    skips.each { java.util.regex.Pattern.compile(it) }
                } catch (Exception failure) {
                    errors.add("Cannot read CycloneDX selection for ${project.path}: ${failure.class.simpleName}")
                    return
                }
                def domains = [[name: 'project', configurations: project.configurations]]
                if (buildEnvironment) {
                    domains.add([name: 'buildscript', configurations: project.buildscript.configurations])
                }
                domains.each { domain ->
                    domain.configurations.findAll { configuration ->
                        configuration.canBeResolved &&
                        (includes.empty || includes.any { configuration.name.matches(it) }) &&
                        !skips.any { configuration.name.matches(it) }
                    }.sort { it.name }.each { configuration ->
                        def identity = [project_path: project.path, domain: domain.name,
                                        configuration: configuration.name]
                        selected.add(identity)
                        def components = []
                        def edges = []
                        def unresolved = []
                        try {
                            def result = configuration.incoming.resolutionResult
                            def rootComponent = result.rootComponent.get()
                            def all = result.allComponents.toList()
                            def ids = [:]
                            all.eachWithIndex { component, index -> ids[component.id] = "c${index}" }
                            all.each { component ->
                                def module = component.id instanceof ModuleComponentIdentifier ?
                                    [group: component.id.group, artifact: component.id.module,
                                     version: component.id.version] : null
                                def kind = component.id == rootComponent.id ? 'root' :
                                    (module == null ? 'project' : 'module')
                                components.add([id: ids[component.id], kind: kind,
                                                module: kind == 'module' ? module : null,
                                                variants: component.variants.collect { it.displayName }.sort()])
                                component.dependencies.each { dependency ->
                                    if (dependency instanceof ResolvedDependencyResult) {
                                        edges.add([source: ids[component.id],
                                                   target: ids[dependency.selected.id],
                                                   requested: dependency.requested.displayName,
                                                   constraint: dependency.constraint])
                                    } else if (dependency instanceof UnresolvedDependencyResult) {
                                        unresolved.add("Unresolved ${dependency.attempted.displayName}")
                                    }
                                }
                            }
                        } catch (Exception failure) {
                            components = [[id: 'root', kind: 'root', module: null, variants: []]]
                            edges = []
                            unresolved.add("Resolution failed: ${failure.class.simpleName}")
                        }
                        scopes.add([scope: identity, components: components,
                                    edges: edges, unresolved: unresolved])
                    }
                }
            }
            if (cdxVersions.size() != 1) {
                errors.add('Expected one loaded CycloneDX producer version')
            }
            if (!root.allprojects.any { it.tasks.findByName('cyclonedxDirectBom')?.enabled }) {
                errors.add('No enabled CycloneDX direct tasks')
            }
            def catalogue = new File(root.projectDir, 'gradle/libs.versions.toml')
            def digest = MessageDigest.getInstance('SHA-256').digest(catalogue.bytes).encodeHex().toString()
            def localProjects = root.allprojects.findAll { project ->
                selected.any { it.project_path == project.path }
            }.sort { it.path }.collect { project ->
                [project_path: project.path,
                 module: [group: project.group.toString(), artifact: project.name,
                          version: project.version.toString()]]
            }
            atomicJson(directory, 'report.json', [schema_version: 1, root_project: root.path,
                producer_versions: [gradle: gradle.gradleVersion,
                    cyclonedx: cdxVersions.size() == 1 ? cdxVersions.first() : 'unknown', report: '2'],
                catalogue_digest: digest, repositories: repositories.unique(),
                selected_scopes: selected, scopes: scopes, local_projects: localProjects,
                selection_errors: errors])
        }
    }
}
